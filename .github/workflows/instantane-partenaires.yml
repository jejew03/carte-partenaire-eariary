# Régénère partenaires/assets/instantane.js depuis le Google Sheet.
#
# Les pages relisent le Sheet elles-mêmes dans le navigateur ; l'instantané
# versionné sert à l'affichage immédiat et aux cas où cette relecture n'aboutit
# pas (feuille redevenue privée, visiteur hors ligne, politique de sécurité de
# l'application hôte interdisant docs.google.com). Il doit donc suivre le Sheet
# sans intervention.
name: Instantané des partenaires

on:
  schedule:
    # Toutes les heures. La 17e minute et non l'heure pile : les tâches
    # planifiées au début d'une heure sont souvent retardées par GitHub.
    - cron: "17 * * * *"
  # Bouton « Run workflow » dans l'onglet Actions, pour forcer une mise à jour
  # après une grosse saisie sans attendre l'heure suivante.
  workflow_dispatch:

permissions:
  contents: write

# Empêche deux exécutions simultanées : la seconde pousserait sur une branche
# que la première vient de faire avancer.
concurrency:
  group: instantane-partenaires
  cancel-in-progress: false

jobs:
  regenerer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build.py n'utilise que la bibliothèque standard : rien à installer.
      - name: Régénérer l'instantané
        id: build
        run: |
          if python partenaires/build.py --check; then
            # Le Sheet n'a pas changé depuis la dernière génération.
            echo "maj=non" >> "$GITHUB_OUTPUT"
          elif python partenaires/build.py; then
            echo "maj=oui" >> "$GITHUB_OUTPUT"
          else
            # Google injoignable ou feuille privée. L'instantané existant reste
            # la meilleure donnée disponible : on avertit sans faire échouer le
            # workflow, pour ne pas notifier une panne passagère toutes les heures.
            echo "::warning::Lecture du Google Sheet impossible ; instantané laissé inchangé."
            echo "maj=non" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier la mise à jour
        if: steps.build.outputs.maj == 'oui'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partenaires/assets/instantane.js
          # Filet de sécurité : `git commit` échoue s'il n'y a rien à valider.
          if git diff --cached --quiet; then
            echo "Rien à publier."
            exit 0
          fi
          git commit -m "Met à jour l'instantané des partenaires depuis le Google Sheet"
          git push
