<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Établissements partenaires eAriary — carte</title>
  <meta name="description" content="Carte et liste des établissements qui acceptent le paiement eAriary à Madagascar.">
  <meta name="robots" content="noindex">

  <!-- Leaflet est embarqué dans le dossier : aucun CDN à autoriser dans la
       politique de sécurité de l'application hôte. Seuls les fonds de carte et
       la relecture du Google Sheet sortent sur le réseau. -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/carte.css">
</head>
<body>
  <!-- data-view, data-header et data-onglet sont posés par assets/carte.js
       d'après les paramètres de l'URL ; le CSS s'en sert comme sélecteurs. -->
  <div class="app" id="app" data-view="split" data-header="1" data-onglet="carte">

    <header class="head">
      <h1 id="titre">Établissements partenaires eAriary</h1>
      <p id="sous-titre">Commerces acceptant le paiement eAriary à Madagascar.</p>
    </header>

    <div class="bar">
      <div class="controls">
        <label class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-5-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/>
          </svg>
          <input type="search" id="recherche" placeholder="Rechercher un établissement"
                 aria-label="Rechercher un établissement" autocomplete="off">
        </label>

        <!-- Options ajoutées par carte.js à partir des données. -->
        <select id="province" aria-label="Filtrer par ville">
          <option value="">Toutes les villes</option>
        </select>

        <span class="spacer"></span>
        <div class="tally">
          <span class="count" id="compte" aria-live="polite"></span>
          <button type="button" class="reset" id="reset" hidden>Réinitialiser</button>
        </div>
      </div>

      <!-- Puces de catégorie : filtre et légende de la carte. -->
      <div class="chips" id="chips" role="group" aria-label="Filtrer par catégorie"></div>
    </div>

    <!-- Bascule carte/liste, visible sous 860 px seulement. -->
    <div class="tabs" id="onglets" role="tablist" aria-label="Affichage">
      <button type="button" role="tab" data-onglet="carte" aria-selected="true">Carte</button>
      <button type="button" role="tab" data-onglet="liste" aria-selected="false">Liste</button>
    </div>

    <div class="body">
      <div class="map" id="carte" role="application" aria-label="Carte des établissements partenaires"></div>
      <div class="list">
        <div id="liste"></div>
        <p class="empty" id="vide" hidden>Aucun établissement ne correspond aux filtres.</p>
      </div>
    </div>

  </div>

  <!-- Ordre imposé : instantane.js et categories.js définissent les variables
       globales que donnees.js et carte.js utilisent. -->
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="assets/instantane.js"></script>
  <script src="assets/categories.js"></script>
  <script src="assets/donnees.js"></script>
  <script src="assets/carte.js"></script>
</body>
</html>
