<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Établissements partenaires eAriary — tableau</title>
  <meta name="description" content="Liste des établissements qui acceptent le paiement eAriary à Madagascar, filtrable par région et par type de marchand.">
  <meta name="robots" content="noindex">

  <!-- Aucune carte ici : ni Leaflet, ni tuiles, ni fond à télécharger. La page
       partage le thème de la carte et n'ajoute que le registre. -->
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/tableau.css">
</head>
<body>
  <div class="app tableau" id="app" data-header="1">

    <header class="head">
      <h1 id="titre">Établissements partenaires eAriary</h1>
      <p id="sous-titre">Commerces acceptant le paiement eAriary à Madagascar.</p>
    </header>

    <div class="bar">
      <div class="controls">
        <label class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-5-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/>
          </svg>
          <input type="search" id="recherche" placeholder="Rechercher un établissement"
                 aria-label="Rechercher un établissement" autocomplete="off">
        </label>

        <select id="region" aria-label="Filtrer par région">
          <option value="">Toutes les régions</option>
        </select>

        <select id="categorie" aria-label="Filtrer par type de marchand">
          <option value="">Tous les types</option>
        </select>

        <span class="spacer"></span>
        <div class="tally">
          <span class="count" id="compte" aria-live="polite"></span>
          <button type="button" class="reset" id="reset" hidden>Réinitialiser</button>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table class="registre">
        <caption class="sr-only">Établissements partenaires eAriary, triables par colonne</caption>
        <thead>
          <tr>
            <th scope="col" data-tri="nom" aria-sort="none">
              <button type="button">Établissement</button>
            </th>
            <th scope="col" data-tri="categorie" aria-sort="none">
              <button type="button">Type</button>
            </th>
            <th scope="col" data-tri="region" aria-sort="none">
              <button type="button">Région</button>
            </th>
            <th scope="col" data-tri="province" aria-sort="none">
              <button type="button">Ville</button>
            </th>
            <!-- Colonne révélée par le script uniquement si le Google Sheet
                 porte un téléphone ou un site : une colonne « Contact » vide
                 dirait au public qu'on ne sait pas joindre les partenaires. -->
            <th scope="col" class="col-contact" id="th-contact" hidden>
              <span class="fixe">Contact</span>
            </th>
            <th scope="col" class="col-lien">
              <span class="fixe">Localisation</span>
            </th>
          </tr>
        </thead>
        <tbody id="lignes"></tbody>
      </table>
      <p class="empty" id="vide" hidden>Aucun établissement ne correspond aux filtres.</p>
    </div>

  </div>

  <script src="assets/instantane.js"></script>
  <script src="assets/categories.js"></script>
  <script src="assets/donnees.js"></script>
  <script src="assets/tableau.js"></script>
</body>
</html>
